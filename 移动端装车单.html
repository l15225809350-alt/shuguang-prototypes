function edit(no){$('scanBtn').style.display='none';current=records.find(r=>r.no===no)||null;locked=current?.status==='已提交';$('form').reset();attachments=[];scanRecords=[];selected=current?[0]:[];if(current){$('mesLoadingNumber').value=current.no;$('erpLoadingNumber').value=current.erp;$('licensePlate').value=current.plate}else{$('mesLoadingNumber').value='MESZC'+Date.now();}try{const saved=JSON.parse(sessionStorage.getItem('mobile-loading-'+$('mesLoadingNumber').value)||'null');if(saved&&!locked){defs.forEach(([id])=>{if(saved[id]!=null)$(id).value=saved[id]});selected=saved.selected||[0];scanRecords=saved.scanRecords||[]}}catch(e){}$('listView').hidden=true;$('editor').hidden=false;$('title').textContent='装车单详情';$('result').textContent=locked?'ERP回传成功，ERP装车单号：'+current.erp:'';renderPicked();renderAttachments();renderScans();lock();window.scrollTo(0,0)}function lock(){$('form').querySelectorAll('input,select').forEach(e=>e.disabled=locked);['choose','files','save','submit','scanBtn'].forEach(id=>$(id).disabled=locked);$('submit').textContent=locked?'已提交':'提交'}function back(){$('scanBtn').style.display='inline-flex';$('scanBtn').disabled=false;$('editor').hidden=true;$('listView').hidden=false;$('title').textContent='装车单';renderList()}
function actualQuantity(i){const matched=scanRecords.filter(r=>String(r.planLineKey)===String(i+1)&&r.uom===LINES[i][10]);return matched.length?matched.reduce((n,r)=>n+Number(r.quantity||0),0).toFixed(3):'—'}function renderPicked(){$('picked').innerHTML=selected.map(i=>'<div class="line"><div class="top"><b>'+LINES[i][0]+'</b>'+''+'</div>'+fields(LINES[i],true).replace('<span>实出数量</span><span>—</span>','<span>实出数量</span><span>'+actualQuantity(i)+'</span>')+'</div>').join('')||'<div class="empty">'+(locked?'暂无可读取的计划明细':'请选择发货计划明细')+'</div>'}function openPicker(){renderPicker();$('picker').showModal()}function renderPicker(){const q=$('pickSearch').value;$('options').innerHTML=LINES.map((r,i)=>({r,i})).filter(({r})=>!q||('1065FJ26100001 '+r.join(' ')).includes(q)).map(({r,i})=>'<label class="line" style="display:block"><div class="top"><b>'+r[0]+'</b><input class="pick" type="checkbox" value="'+i+'" '+(selected.includes(i)?'checked':'')+'></div><p>'+r[2]+'</p><span class="muted">1065FJ26100001 · '+r[4]+'</span><div class="qty"><span><small>计划数量</small>'+r[6]+' '+r[10]+'</span><span><small>可装车数量</small>'+r[9]+' '+r[10]+'</span></div></label>').join('')}function pick(){const visible=[...document.querySelectorAll('.pick')];selected=selected.filter(i=>!visible.some(e=>+e.value===i)).concat(visible.filter(e=>e.checked).map(e=>+e.value));renderPicked();$('picker').close()}
$('files').onchange=e=>{for(const file of e.target.files)if(file.type.startsWith('image/')&&!attachments.some(f=>f.name===file.name&&f.size===file.size))attachments.push(file);e.target.value='';renderAttachments()};function renderAttachments(){$('attachments').innerHTML='';if(!attachments.length){$('attachments').textContent='暂无图片';return}attachments.forEach((f,i)=>{const row=document.createElement('div');row.className='attachment';const a=document.createElement('a');a.textContent=f.name+' ('+(f.size/1024).toFixed(1)+' KB)';a.href=URL.createObjectURL(f);a.download=f.name;const b=document.createElement('button');b.textContent='移除';b.disabled=locked;b.onclick=()=>{URL.revokeObjectURL(a.href);attachments.splice(i,1);renderAttachments()};row.append(a,b);$('attachments').append(row)})}
function payload(){return {...Object.fromEntries(defs.map(([id])=>[id,$(id).value])),selected,scanRecords,lines:selected.map(i=>({planNumber:'1065FJ26100001',planLineKey:String(i+1),source:LINES[i][0],item:LINES[i][1],lotNumber:LINES[i][4],quantity:Number(LINES[i][6]),uom:LINES[i][10]}))}}function save(){$('result').hidden=false;sessionStorage.setItem('mobile-loading-'+$('mesLoadingNumber').value,JSON.stringify(payload()));$('result').textContent='装车信息已保存'+(attachments.length?'；附件将在提交时上传':'');if(!current){current={no:$('mesLoadingNumber').value,erp:'—',plan:'1065FJ26100001',customer:'客户甲',plate:$('licensePlate').value,count:selected.length,status:'未提交',sync:'未提交'};records.unshift(current)}else{current.plate=$('licensePlate').value;current.count=selected.length}}
async function submitERP(){$('result').hidden=false;if(!$('form').reportValidity())return;if(!selected.length){$('result').textContent='请选择发货计划明细';return}if(!API_CONFIG.submitLoading){$('result').textContent='ERP接口尚未配置，请联系系统管理员';return}$('submit').disabled=true;$('result').textContent='正在提交ERP…';try{const body=new FormData();body.append('payload',JSON.stringify(payload()));attachments.forEach(f=>body.append('attachments',f,f.name));const r=await fetch(API_CONFIG.submitLoading,{method:'POST',body,credentials:'same-origin'});const d=await r.json();if(!r.ok||d.success!==true)throw Error(d.message||'ERP回传失败');save();current.status='已提交';current.sync='成功';current.erp=d.erpLoadingNumber||'—';$('erpLoadingNumber').value=current.erp;$('result').textContent='回传成功\nERP装车单号：'+current.erp;locked=true;lock();renderPicked();renderAttachments()}catch(e){$('result').textContent='提交失败：'+e.message;$('submit').disabled=false}}
function openScan(){if(!$('editor').hidden)return;openScanPrompt()}function openScanPrompt(){$('scanDialog').showModal();$('scanCode').value='';$('scanResult').textContent='';$('scanTip').textContent='先选择销售订单，再扫描成品码';$('scanCode').placeholder='请扫描或输入成品码';$('scanSalesOrder').focus()}
function stopScan(){clearTimeout(scanTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').hidden=true;$('scanDialog').close()}$('scanDialog').addEventListener('cancel',stopScan);$('scanCode').onkeydown=e=>{if(e.key==='Enter')resolveScan()};async function camera(){try{if(!('BarcodeDetector' in window))throw Error('当前浏览器不支持摄像头识码，请使用扫码设备输入');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('video').srcObject=stream;$('video').hidden=false;await $('video').play();const detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13']});async function tick(){if(!stream)return;try{const codes=await detector.detect($('video'));if(codes.length){$('scanCode').value=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());stream=null;$('video').hidden=true;await resolveScan();return}}catch(e){}scanTimer=setTimeout(tick,350)}tick()}catch(e){$('scanTip').textContent=e.message}}
async function resolveScan(){const code=$('scanCode').value.trim();if(!code)return;const salesOrder=$('scanSalesOrder').value.trim();if(!salesOrder){$('scanResult').textContent='请先选择销售订单';return;}const eligible=LINES.map((r,i)=>({r,i})).filter(x=>x.r[0].split(' /')[0]===salesOrder);if(!eligible.length){$('scanResult').textContent='该销售订单无有效发货计划';return;}if(scanRecords.some(s=>s.code===code)){$('scanResult').textContent='该标签已扫描，请勿重复装车';return}if(!API_CONFIG.resolveScan){$('scanResult').textContent='扫码识别接口尚未配置，已读取标签码：'+code;return}try{const r=await fetch(API_CONFIG.resolveScan,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,salesOrder,planLines:eligible.map(x=>({planLineKey:String(x.i+1),item:x.r[1],lotNumber:x.r[4]}))})});const d=await r.json();if(!r.ok||d.success!==true)throw Error(d.message||'标签识别失败');const matched=eligible.find(x=>String(x.i+1)===String(d.planLineKey));if(!matched||d.item&&d.item!==matched.r[1]||d.lotNumber&&d.lotNumber!==matched.r[4])throw Error('扫码物料不符合当前发货计划，不能创建装车单');if($('editor').hidden){edit();selected=[];}if(!selected.includes(matched.i))selected.push(matched.i); scanRecords.push({code,planLineKey:d.planLineKey,quantity:d.quantity,uom:d.uom});renderScans();renderPicked();$('scanResult').textContent='物料匹配成功，已创建装车单，请维护装车信息';$('scanCode').value=''}catch(e){$('scanResult').textContent=e.message}}function renderScans(){$('scans').textContent=scanRecords.length?scanRecords.map(s=>s.code+' · '+s.quantity+' '+s.uom).join('\n'):'暂无扫码记录'}window.onScanResult=code=>{openScan();$('scanCode').value=code;resolveScan()};renderList();if(new URLSearchParams(location.search).has('plan'))edit();

function renderAttachments(){const container=$('attachments');container.replaceChildren();if(!attachments.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='暂无图片';container.append(empty);return;}attachments.forEach((file,index)=>{if(!mobileImageURLs.has(file))mobileImageURLs.set(file,URL.createObjectURL(file));const card=document.createElement('div');card.className='mobile-image-card';const link=document.createElement('a');link.href=mobileImageURLs.get(file);link.target='_blank';link.rel='noopener';const image=document.createElement('img');image.src=link.href;image.alt=mobileImageDescriptions.get(file)||file.name;link.append(image);const caption=document.createElement('div');caption.className='mobile-image-caption';if(locked){const text=document.createElement('p');text.textContent=mobileImageDescriptions.get(file)||'暂无图片描述';caption.append(text);}else{const note=document.createElement('button');note.className='image-note';note.textContent=mobileImageDescriptions.get(file)||'＋ 添加说明（选填）';note.onclick=()=>openImageNote(file);caption.append(note);const remove=document.createElement('button');remove.className='link';remove.textContent='移除';remove.onclick=()=>{URL.revokeObjectURL(mobileImageURLs.get(file));mobileImageURLs.delete(file);mobileImageDescriptions.delete(file);attachments.splice(index,1);renderAttachments();};caption.append(remove);}card.append(link,caption);container.append(card);});}
