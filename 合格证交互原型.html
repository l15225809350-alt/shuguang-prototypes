const CERT_DATA=[{"name": "合格证记录", "prefix": "certificate", "collection": false, "table": "mes_certificate_record", "fields": [{"label": "申请单号", "key": "certificate.applicationNo", "type": "文本", "source": "LIMS页面已见；最终检测申请", "rule": "可选；模板设为必填则缺值阻断打印", "sample": "FG26-1013003"}, {"label": "成品质检批号", "key": "certificate.qualityBatchNo", "type": "文本", "source": "质检人员手工填写，无默认值", "rule": "必填且唯一，不自动取库存批号或盘具号", "sample": ""}, {"label": "检验类型", "key": "certificate.inspectionType", "type": "文本", "source": "LIMS页面已见；源最终检验", "rule": "可选；模板设为必填则缺值阻断打印", "sample": "完工检验(成品例行)"}, {"label": "产品名称", "key": "certificate.productName", "type": "文本", "source": "LIMS页面已见；当前成品物料", "rule": "生成记录必需；检测结果必须合格", "sample": "电力电缆"}, {"label": "型号规格", "key": "certificate.modelSpecification", "type": "文本", "source": "成品物料档案的型号规格完整值", "rule": "可选；模板设为必填则缺值阻断打印", "sample": "FGC-1P1.5-FRT-ASC-BL 1×1.5"}, {"label": "执行标准", "key": "certificate.standard", "type": "文本", "source": "LIMS页面已见；适用标准快照", "rule": "曙光样板引用时必需；无值禁止打印", "sample": "Q/321084KLA049-2025 技术协议"}, {"label": "电压等级", "key": "certificate.voltageLevel", "type": "文本", "source": "LIMS页面已见；成品物料特征", "rule": "曙光样板引用时必需；无值禁止打印", "sample": "450/750 V"}, {"label": "毛重", "key": "certificate.grossWeight", "type": "小数", "source": "LIMS页面已见；成品称重", "rule": "可选；模板设为必填则缺值阻断打印", "sample": ""}, {"label": "净重", "key": "certificate.netWeight", "type": "小数", "source": "LIMS页面已见；成品称重", "rule": "曙光样板引用时必需；无值禁止打印", "sample": "96.00"}, {"label": "盘具号", "key": "certificate.reelNo", "type": "文本", "source": "LIMS页面已见；源生产段/盘具号", "rule": "保留源业务值；不得当成品质检批号使用", "sample": "PC20230329000-02-3824"}, {"label": "制造长度", "key": "certificate.manufactureLength", "type": "小数", "source": "LIMS页面已见；当前成品实绩", "rule": "曙光样板引用时必需；无值禁止打印", "sample": "185.00"}, {"label": "盘数", "key": "certificate.reelCount", "type": "整数", "source": "LIMS页面已见；本记录覆盖的盘数", "rule": "标准一成品单元一记录，固定1；不得跨盘汇总", "sample": "1"}, {"label": "制造日期", "key": "certificate.manufacturedOn", "type": "日期", "source": "LIMS页面已见；成 ；当前合格证记录扩展属性", "rule": "可选；模板设为必填则缺值阻断打印", "sample": ""}]}];
const fields=CERT_DATA[0].fields;
const displayFields=fields.filter(f=>!/^扩展字段[1-5]$/.test(f.label));
const $=id=>document.getElementById(id);let page='records',records=[],selected=new Set(),chosen=[],copies=1,binding=['modelSpecification','qualityBatchNo','voltageLevel','manufactureLength','meterMark','netWeight','manufacturedOn','inspectionMark','standard','remark'],currentCell=0;
const base=Object.fromEntries(fields.map(f=>[f.key.split('.')[1],f.sample]));base.manufactureLength='185.00 m';base.netWeight='96.00 kg';
function createRecord(id){if(records.some(x=>x.id===id))return records.find(x=>x.id===id);let x={...base,id,materialGroup:'低压电缆物料分组',process:'成品完工',workCenter:'低压成品工作中心',letx:0,certificateNo:'HGZ20261014'+String(records.length+1).padStart(4,'0'),recordStatus:'可打印',printStatus:'未打印',locked:false,count:0,log:['最终检验合格并审核通过 → 自动生成记录'],template:'',version:1};records.push(x);return x}
createRecord('UNIT001');let prior=createRecord('UNIT002');prior.qualityBatchNo='ZJ20261014002';prior.printStatus='已打印';prior.locked=true;prior.count=1;prior.template='曙光合格证 V1.0';prior.issuedOn='2026-10-13';prior.log.push('已固化模板及文件 → 纸张输出已确认');
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}function closeModal(){$('modal').innerHTML=''}function show(p){page=p;document.body.classList.toggle('mesTemplate',p==='templates'||p==='designer');closeModal();if(p==='quality')quality();else if(p==='templates')templates();else if(p==='designer')designer();else list()}
function saveQualityBatch(){let v=$('qualityBatchInput').value.trim();if(!v){toast('请填写成品质检批号');return}if(records.some(x=>x.id!==records[0].id&&x.qualityBatchNo===v)){toast('成品质检批号已存在');return}records[0].qualityBatchNo=v;toast('成品质检批号已保存')}
function quality(){$('app').innerHTML=`<h1>成品质检完成</h1><p>最终判定合格，既有审核通过后自动生成记录；打印是后续操作。</p><div class="panel"><h2>最终检验 FG26-1013003　<span class="tag">合格 · 审核通过</span></h2><div class="grid"><div>成品质检批号<input id="qualityBatchInput" placeholder="由质检人员填写，无默认值" value="${records[0].qualityBatchNo||''}"><button onclick="saveQualityBatch()">保存批号</button></div><div>物料<strong>1016030375</strong></div><div>合格证记录<strong>${records[0].applicationNo}</strong></div></div><p>合格证记录已生成 · 未打印 · 当前可打印</p><button class="primary" onclick="begin(['UNIT001'])">打印合格证</button> <button onclick="edit('UNIT001')">查看记录</button></div><div class="panel"><h3>另一成品单元最终检测</h3><p>用于演示合格事件自动生成一条记录，重复点击返回同一记录。</p><button onclick="createRecord('UNIT003');toast('记录已生成；重复事件不新增');show('records')">模拟检测合格并审核通过</button></div>`}
let statusFilter='全部';
function list(){$('app').innerHTML=`<div class="limsQuery"><input id="q" placeholder="请输入申请单号、产品名称、型号规格"><button class="primary" onclick="filter()">查询</button><button onclick="show('records')">重置</button><span style="flex:1"></span><button class="primary" onclick="begin([...selected])">▣ 批量打印</button></div><div class="panel"><div class="filters" style="margin-bottom:24px"><div class="seg">${['全部','未打印','已打印'].map(k=>`<button class="${statusFilter===k?'active':''}" onclick="statusFilter='${k}';show('records')">${k}</button>`).join('')}</div></div><div class="tablewrap"><table class="limsTable"><thead><tr><th class="checkCol"><input type="checkbox" onchange="records.forEach(x=>this.checked?selected.add(x.id):selected.delete(x.id));list()"></th>${displayFields.map(f=>'<th>'+f.label+'</th>').join('')}<th class="statusCol">打印状态</th><th class="opCol">操作</th></tr></thead><tbody id="rows">${records.filter(x=>statusFilter==='全部'||x.printStatus===statusFilter||(statusFilter==='未打印'&&x.count===0)).map(x=>`<tr data-id="${x.id}"><td class="checkCol"><input type="checkbox" ${selected.has(x.id)?'checked':''} onchange="this.checked?selected.add('${x.id}'):selected.delete('${x.id}')"></td>${displayFields.map(f=>'<td>'+escapeHtml(x[f.key.split('.')[1]]||'--')+'</td>').join('')}<td class="statusCol">${x.printStatus}</td><td class="opCol"><button class="textLink" onclick="edit('${x.id}')">编辑</button><button class="textLink" onclick="begin(['${x.id}'])">打印</button></td></tr>`).join('')}</tbody></table></div><div class="pagination">共 ${records.length} 条　 <select><option>20条/页</option></select>　 ‹　 <span style="color:#00ad7a">1</span>　 ›　 前往 <input value="1" style="width:45px"> 页</div></div>`}
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}


function filter(){let q=$('q').value,s=statusFilter;document.querySelectorAll('#rows tr').forEach(tr=>{let x=records.find(x=>x.id===tr.dataset.id);tr.hidden=(q&&!tr.textContent.includes(q))||(s!=='全部'&&x.printStatus!==s)})}
function edit(id){let x=records.find(x=>x.id===id);$('modal').innerHTML=`<div class="overlay"><div class="dialog"><div class="pagebar"><h2>合格证记录 ${x.applicationNo}</h2><button onclick="closeModal()">关闭</button></div><p>申请单号、成品质检批号只读，其余展示字段可编辑。</p><div class="form">${fields.filter(f=>!['inspectionType','productionOrderNo','inspectionResult','qrPayload','materialCode','temperature'].includes(f.key.split('.')[1])).map(f=>{let k=f.key.split('.')[1],allowed=!['applicationNo','qualityBatchNo'].includes(k);return `<label>${f.label}<input data-key="${k}" value="${String(x[k]||'').replaceAll('&','&amp;').replaceAll('"','&quot;')}" ${allowed?'':'readonly'}></label>`}).join('')}</div><p>变更记录：${x.log.join('；')}</p><div class="actions"><button onclick="closeModal()">关闭</button><button class="primary"  onclick="saveRecord('${id}')">保存补充信息</button></div></div></div>`}
function saveRecord(id){let x=records.find(x=>x.id===id);document.querySelectorAll('input[data-key]:not([readonly])').forEach(e=>x[e.dataset.key]=e.value);x.log.push('授权人员补充信息；原值与新值由正式服务审计');closeModal();show('records');toast('补充信息已保存（演示）')}
function recommendTemplates(x){let rules=[{rule:'物料＋工序',priority:1,match:x.materialCode==='1016030375'&&x.process==='成品完工'},{rule:'物料分组＋工序',priority:2,match:x.materialGroup==='低压电缆物料分组'&&x.process==='成品完工'},{rule:'工作中心＋工序',priority:3,match:x.workCenter==='低压成品工作中心'&&x.process==='成品完工'}];return nativeTemplates.filter(t=>t.business==='合格证检').map(t=>{let r=rules.find(r=>r.rule===t.rule&&r.match);return {...t,priority:r?.priority||99,recommended:!!r}}).sort((a,b)=>a.priority-b.priority)}
function templateOptions(x){let list=recommendTemplates(x);return list.map((t,i)=>`<option value="${t.name} ${t.version}" ${i===0?'selected':''}>${t.recommended?'推荐 · ':''}${t.name} ${t.version} · ${t.rule}</option>`).join('')}
function begin(ids){if(!ids.length){toast('请选择合格证记录');return}chosen=ids.map(id=>records.find(x=>x.id===id));if(chosen.some(x=>!x.qualityBatchNo)){toast('请先编辑填写成品质检批号');return}if(chosen.some(x=>x.recordStatus!=='可打印'||x.inspectionResult!=='合格')){toast('存在不可打印记录');return}copies=1;$('modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>${chosen[0].locked?'补打原证':'选择合格证模板'}</h2><p>已存在 ${chosen.length} 条记录；打印不会新增合格证记录。</p><label class="printTemplateLabel"><span><i>*</i> 选择合格证模板</span><select id="tpl"><option value="">请选择</option>${templateOptions(chosen[0])}</select></label><p class="recommendHint">系统已按物料、工序、物料分组、工作中心及规则优先级推荐模板，可手动切换。</p>${chosen.some(x=>x.locked)?'<p>包含历史补打记录，将沿用原模板、原文件及原数据快照。</p><input id="reason" placeholder="必填：补打原因">':''}<div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="preparePreview()">预览</button></div></div></div>`}
function preparePreview(){let mixed=chosen.some(x=>x.locked)&&chosen.some(x=>!x.locked);if(chosen.some(x=>!x.locked)&&!$('tpl').value){toast('请选择合格证模板');return}if(chosen.some(x=>x.locked)&&!$('reason').value.trim()){toast('请填写补打原因');return}let template=$('tpl')?.value||'';let reason=$('reason')?.value||'';chosen.forEach(x=>{x.pendingTemplate=x.locked?x.template:template;x.pendingReason=x.locked?reason:''});printPreview()}

function printPreview(){$('modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>合格证打印预览</h2><p>${chosen[0].pendingTemplate} · A4 普通白纸 · ${chosen.length} 张 · 不新增记录</p><div class="preview">${paper(chosen[0])}</div><div class="actions"><label>每张份数 <select id="copies">${Array.from({length:10},(_,i)=>'<option>'+(i+1)+'</option>').join('')}</select></label><button onclick="closeModal()">取消预览</button><button class="primary" onclick="launchPrint()">打印（模拟）</button></div></div></div>`}
function launchPrint(){copies=+$('copies').value;chosen.forEach(x=>{if(!x.locked){x.locked=true;x.template=x.pendingTemplate;x.issuedOn='2026-10-14';x.log.push('首次输出文件固化记录及模板')}x.printStatus='待确认';x.log.push('打印发起；份数 '+copies)});$('modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>打印结果待确认</h2><p>原型仅模拟打印对话框；实际纸张输出必须由人员确认。</p><p>${chosen.length} 条记录 × ${copies} 份；记录总数仍为 ${records.length}。</p><div class="actions"><button onclick="complete('已取消')">取消</button><button onclick="complete('失败')">登记失败</button><button class="primary" onclick="complete('已打印')">纸张已输出</button></div></div></div>`}
function complete(status){chosen.forEach(x=>{x.printStatus=status==='已打印'||x.count===0?status:'已打印';if(status==='已打印')x.count++;x.log.push('最近尝试 '+status+(x.pendingReason?'；补打原因 '+x.pendingReason:''))});selected.clear();show('records');toast('打印结果已记录')}
let nativeTemplates=[{id:'000000055',name:'低压电缆合格证',business:'合格证检',version:'V2.0',status:'已启用',rule:'物料＋工序',process:'成品完工',scope:'M01001 低压电力电缆'},{id:'000000056',name:'特缆合格证',business:'合格证检',version:'V1.0',status:'已启用',rule:'物料＋工序',process:'成品完工',scope:'M02008 特种电缆'},{id:'000000044',name:'低压车间自检模板',business:'自检',version:'V1.0',status:'已启用',rule:'物料分组＋工序',process:'绝缘',scope:'低压电缆物料分组'}];
let nativeFilter='合格证检',nativeStatus='全部',nativeTarget=null,designerReadOnly=false;
function templates(){let rows=nativeTemplates.filter(t=>(nativeFilter==='全部'||t.business===nativeFilter)&&(nativeStatus==='全部'||t.status===nativeStatus));$('app').innerHTML=title('检测模板','通过检测业务管理不同模板，合格证检复用系统在线设计组件',`<button class="primary" onclick="editTemplate()">新增模板</button>`)+`<div class="panel"><div class="filters"><label>关键字<input id="templateSearch" placeholder="输入模板名称"></label><label>检测业务<select id="nativeBusiness" onchange="nativeFilter=this.value;templates()"><option ${nativeFilter==='全部'?'selected':''}>全部</option><option ${nativeFilter==='合格证检'?'selected':''}>合格证检</option><option ${nativeFilter==='自检'?'selected':''}>自检</option><option>互检</option><option>巡检</option><option>成品检验</option></select></label><label>适用项目<input placeholder="选择适用项目" readonly></label><button class="primary" onclick="filterNative()">查询</button><button onclick="nativeFilter='全部';nativeStatus='全部';templates()">重置</button></div></div><div class="panel"><div class="tabs">${['全部','新建中','已启用','已停用'].map(s=>`<button class="${s===nativeStatus?'active':''}" onclick="nativeStatus='${s}';templates()">${s}</button>`).join('')}</div><table><thead><tr><th>编号</th><th>模板名称</th><th>检测业务</th><th>规则方案</th><th>适用工序</th><th>版本 / 状态</th><th>操作</th></tr></thead><tbody id="nativeRows">${rows.map(t=>`<tr><td><button class="link" onclick="editTemplate('${t.id}')">${t.id}</button></td><td>${t.name}</td><td>${tag(t.business,t.business==='合格证检'?'green':'gray')}</td><td>${t.rule}</td><td>${t.process}</td><td>${t.version} ${tag(t.status,t.status==='已启用'?'green':'gray')}</td><td><button class="link" onclick="openExisting('${t.id}')">在线设计</button></td></tr>`).join('')}</tbody></table><div class="hint">合格证检用于出证模板配置，出证资格仍取成品最终检验；不会新增送检或质量判定。</div><div class="foot"><span>共 ${rows.length} 条　　适用规则沿用物料＋工序 / 物料分组＋工序 / 工作中心＋工序</span><span>每页 50 条　 ‹　1　›</span></div></div>`}
function filterNative(){let value=$('templateSearch').value.trim();Array.from($('nativeRows').rows).forEach(r=>r.hidden=value&&!r.textContent.includes(value))}
function editTemplate(id){nativeTarget=id?nativeTemplates.find(t=>t.id===id):null;let t=nativeTarget||{id:'000000057',name:'',business:'合格证检',version:'V1.0',status:'新建中',rule:'物料＋工序',process:'成品完工',scope:'M01001 低压电力电缆'};designerReadOnly=!!nativeTarget&&t.status==='已启用';$('modal').innerHTML=`<div class="overlay nativeOverlay"><section class="nativeDrawer"><div class="drawerTop"><h2>${nativeTarget?'模板配置':'新增模板'}</h2><button onclick="closeModal()" aria-label="关闭模板抽屉">×</button></div><div class="drawerScroll"><div class="drawerMeta"><span>${t.id}</span><span>${t.version} · ${t.status}</span></div><div class="editor"><label><span class="req">*</span>模板名称<input id="templateName" placeholder="请输入模板名称" value="${t.name}" ${designerReadOnly?'readonly':''}></label><label><span class="req">*</span>检测业务<select id="templateBusiness" ${designerReadOnly?'disabled':''} onchange="businessChanged(this.value)">${['自检','互检','巡检','成品检验','合格证检'].map(v=>`<option ${v===t.business?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="drawerLabel">说明<textarea id="templateDesc" placeholder="填写合格证版式用途" ${designerReadOnly?'readonly':''}>${t.business==='合格证检'?'成品检验完成且合格后，按适用规则选择本模板出证。':''}</textarea></label><h3>适用规则</h3><div class="editor"><label><span class="req">*</span>规则方案<select id="templateRule" ${designerReadOnly?'disabled':''} onchange="ruleChanged(this.value)">${['物料＋工序','物料分组＋工序','工作中心＋工序'].map((r,i)=>`<option value="${r}" ${r===t.rule?'selected':''}>第${i+1}优先级：${r}</option>`).join('')}</select></label><label><span class="req">*</span>工序<select id="templateProcess" ${designerReadOnly?'disabled':''}><option>${t.process}</option><option>其他成品末道工序</option></select></label></div><div class="bar"><span id="scopeLabel">适用成品物料</span><div><button onclick="chooseScope()" ${designerReadOnly?'disabled':''}>选择</button> <button onclick="toast('导入适用对象清单，版式由在线组件配置（演示）')" ${designerReadOnly?'disabled':''}>导入</button></div></div><table><thead><tr><th>编码</th><th>名称</th><th>型号规格</th><th>单位</th></tr></thead><tbody id="scopeTable"><tr><td>M01001</td><td>低压电力电缆</td><td>YJV 3×95+1×50</td><td>m</td></tr></tbody></table><div class="foot"><span>第 1/1 页，共 1 条</span><span>50 条 / 页</span></div><h3 style="margin-top:25px">模板设计</h3><div class="designOptions"><label><input type="radio" name="designWay" value="online" checked onchange="copyOption(false)"><strong>在线设计</strong><small>系统自带表格组件</small></label><label><input type="radio" name="designWay" value="copy" onchange="copyOption(true)"><strong>复制模板</strong><small>引用已维护的同业务版式</small></label></div><div id="copySelector" hidden></div><div id="businessHint" class="hint">检测业务为合格证检：左侧载入合格证记录表27个字段，纸张默认 A4 纵向。</div></div><div class="drawerBottom"><button onclick="closeModal()">取消</button><button class="primary" onclick="nextDesigner()">${designerReadOnly?'查看在线设计':'下一步'}</button></div></section></div>`}
function ruleChanged(r){let name=r.startsWith('物料分组')?'适用物料分组':r.startsWith('工作中心')?'适用工作中心':'适用成品物料';$('scopeLabel').textContent=name;$('scopeTable').innerHTML='<tr><td colspan="4" style="text-align:center;color:#94a0af">规则已变更，请重新选择适用对象</td></tr>';toast('已清空不相容对象，请重新选择')}
function chooseScope(){let r=$('templateRule').value;let vals=r.startsWith('物料分组')?['MG001','低压电缆物料分组','—','—']:r.startsWith('工作中心')?['WC-LV01','低压成品工作中心','—','—']:['M01001','低压电力电缆','YJV 3×95+1×50','m'];$('scopeTable').innerHTML='<tr>'+vals.map(v=>'<td>'+v+'</td>').join('')+'</tr>'}
function businessChanged(b){$('businessHint').textContent=b==='合格证检'?'合格证检：载入合格证记录表27个字段；不新增检验任务。':'当前选择其他检测业务；其检验设计保持原流程。本原型演示合格证检设计。'}
function copyOption(v){$('copySelector').hidden=!v;if(v)$('copySelector').innerHTML=`<label class="drawerLabel">来源模板<select id="copyFrom">${nativeTemplates.filter(t=>t.business==='合格证检').map(t=>`<option value="${t.id}">${t.name} ${t.version}</option>`).join('')}</select></label>`}
function nextDesigner(){if(!$('templateName').value.trim()){toast('请输入模板名称');return}if($('templateBusiness').value!=='合格证检'){toast('请将检测业务选择为合格证检');return}if($('scopeTable').textContent.includes('重新选择')){toast('请配置适用对象');return}let name=$('templateName').value.trim();if(!nativeTarget){nativeTarget={id:'0000000'+(55+nativeTemplates.length),name,business:'合格证检',version:'V1.0',status:'新建中',rule:$('templateRule').value,process:$('templateProcess').value,scope:$('scopeTable').textContent};nativeTemplates.unshift(nativeTarget)}else if(!designerReadOnly){nativeTarget.name=name;nativeTarget.rule=$('templateRule').value;nativeTarget.process=$('templateProcess').value}if(document.querySelector('input[name=designWay]:checked')?.value==='copy'){let source=nativeTemplates.find(t=>t.id===$('copyFrom').value);nativeTarget.fields=[...(source?.fields||binding)]}show('designer')}
function openExisting(id){nativeTarget=nativeTemplates.find(t=>t.id===id);if(nativeTarget.business!=='合格证检'){toast('自检继续使用原检验上下文，不进入合格证检设计器');return}designerReadOnly=nativeTarget.status==='已启用';show('designer')}

function title(t,d,a){return `<div class="pagebar"><div><h1>${t}</h1><p>${d}</p></div>${a}</div>`}function tag(t,c){return `<span class="tag ${c}">${t}</span>`}
function saveTemplate(){if(designerReadOnly){toast('已启用版本只读，请复制新版本');return}if(nativeTarget)nativeTarget.fields=[...binding];toast('模板草稿已保存（演示）')}
function copyTemplateVersion(){nativeTarget={...nativeTarget,id:nativeTarget.id+'-COPY',status:'新建中',version:'新版本草稿',fields:[...binding]};nativeTemplates.unshift(nativeTarget);designerReadOnly=false;designer()}
function designer(){if(nativeTarget?.fields)binding=[...nativeTarget.fields];$('app').innerHTML=`<div class="pagebar"><h1>在线设计 · 合格证检</h1><div><button onclick="show('templates')">返回</button> <button onclick="designPreview()">预览</button> ${designerReadOnly?'<button class="primary" onclick="copyTemplateVersion()">复制为新版本</button>':'<button class="primary" onclick="saveTemplate()">保存草稿</button>'}</div></div><div class="designer"><section class="panel sources"><h3>合格证记录</h3><p class="note">唯一数据源 · 27个字段</p><input placeholder="搜索字段" oninput="searchFields(this.value)"><div id="fieldTree">${fields.map(f=>`<button data-label="${f.label}${f.key}" onclick="bind('${f.key.split('.')[1]}')" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${f.key.split('.')[1]}')"><span>${f.label}</span><small>${f.type}</small></button>`).join('')}</div></section><section class="panel"><p>A4 210 × 297 mm · 纵向 · 非套打</p><h2 style="text-align:center">产品合格证</h2><div id="cells"></div><div class="actions"><button onclick="if(!designerReadOnly){binding.push('remark');paint()}">添加字段单元格</button><button onclick="toast('企业抬头、LOGO与地址由固定文本/图片组件配置')">固定文字 / 图片</button></div></section><section class="panel"><h3>组件属性</h3><div id="prop"></div><p class="note">技术主键、组织和源快照不开放绑定。核心事实不可通过扩展字段覆盖；首次输出后冻结纸面内容。</p></section></div>`;paint()}
function paint(){$('cells').innerHTML='<table>'+binding.map((k,i)=>{let f=fields.find(f=>f.key==='certificate.'+k);return `<tr onclick="currentCell=${i};paint()" ondragover="event.preventDefault()" ondrop="event.preventDefault();currentCell=${i};bind(event.dataTransfer.getData('text/plain'))" style="${i===currentCell?'background:#e8f7ee':''}"><td>${f?.label||k}</td><td>〈${f?.key||k}〉</td></tr>`}).join('')+'</table>';let f=fields.find(f=>f.key==='certificate.'+binding[currentCell]);$('prop').innerHTML=f?`<p>字段：${f.label}</p><p>标识：${f.key}</p><p>类型：${f.type}</p><p>来源：合格证记录表</p><p>${f.rule}</p>`:''}
function bind(k){if(designerReadOnly){toast('已启用模板只读');return}if(!fields.some(f=>f.key==='certificate.'+k))return;binding[currentCell]=k;paint()}function searchFields(q){document.querySelectorAll('#fieldTree button').forEach(x=>x.hidden=!x.dataset.label.includes(q))}
function designPreview(){$('modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>模板字段测试预览</h2><p>使用已生成合格证记录的字段快照；二维码内容为空时不生成虚构图码。</p><table>${binding.map(k=>{let f=fields.find(f=>f.key==='certificate.'+k);return '<tr><td>'+f.label+'</td><td>'+(records[0][k]||'（空值，按模板必填规则校验）')+'</td></tr>'}).join('')}</table><div class="actions"><button onclick="closeModal()">关闭</button></div></div></div>`}
show('records');
</script></html>
