abel></div><div class="query-actions"><button class="link" onclick="toggleFilters('salesMore',this)">更多⌄</button><button onclick="resetSales()">重置</button><button class="primary" onclick="renderSales()">查询</button></div></div><div id="salesList"></div></div></section><section id="saleDetail" class="hidden"><div class="panel"><div class="head"><h2 id="detailTitle">新增退货登记</h2><button onclick="view('sales')">返回列表</button></div><div class="hint">订单信息由选单带出，只读。保存后需质检行进入待检验，免检行直接已处理。</div><div id="saleInfo" class="form"></div></div><div class="panel"><div class="head"><h2>ERP 回传信息</h2></div><div class="form" id="returnContract"></div></div><div class="panel"><div class="head"><h2>销售退货明细</h2><button id="chooseBtn" onclick="openPicker()">选单 / 勾选明细</button></div><div id="editLines" class="scroll"></div><div class="foot"><button id="saveBtn" class="primary" onclick="saveSale()">保存</button></div></div></section><dialog id="picker"><div class="head"><h2>选择退货订单及明细</h2><button onclick="picker.close()">关闭</button></div><div class="filters picker-filter"><label>退货订单 <select id="pickOrder" onchange="pickRows()"></select></label><label>物料编码 <input id="pickLineNo" placeholder="请输入物料编码" oninput="pickRows()"></label></div><div id="pickLines" class="scroll"></div><div class="foot"><button class="primary" onclick="addPicked()">带入勾选明细</button></div></dialog></main><script>
