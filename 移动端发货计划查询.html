<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发货计划查询</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#30343b;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:52px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}header strong{font-size:17px}button,a,input,select{font:inherit}button,a{cursor:pointer}button{border:0;background:white;color:#444;border-radius:6px;padding:10px 14px;min-height:40px}a{color:#00a574;text-decoration:none}.icon{font-size:21px;padding:8px;min-width:36px}.primary{background:#00ad7b;color:white}.outline{border:1px solid #00ad7b;color:#009f73}.search{display:flex;gap:8px;padding:12px 16px;background:white}.search input{flex:1;min-width:0;background:#f5f6f8;border:0;border-radius:6px;padding:11px}.chips{display:flex;overflow:auto;gap:8px;padding:0 16px 12px;background:white}.chips button{white-space:nowrap;background:#f5f6f8;border-radius:20px;min-height:32px;padding:7px 14px}.chips .active{color:#00a574;background:#e8f8f1}.card,.section{background:white;margin:10px 12px;border-radius:8px;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.number{font-weight:600;overflow-wrap:anywhere}.badge{color:#00a574;background:#e9f8f1;padding:4px 8px;border-radius:4px;white-space:nowrap;font-size:12px}.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;margin-top:14px;line-height:1.5}.kv span:nth-child(odd){color:#90959d}.kv span{overflow-wrap:anywhere}.actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #f0f1f3;padding-top:12px;margin-top:14px}h3{font-size:15px;margin:0 0 14px}details{border-top:1px solid #eee;margin-top:14px;padding-top:14px}summary{cursor:pointer;font-weight:500}label.field{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:8px;border-bottom:1px solid #f0f1f3;padding:10px 0}input,select,textarea{width:100%;min-width:0;padding:10px;border:1px solid #e4e7eb;border-radius:5px;background:white;color:#333}input[readonly]{background:#f7f8fa}input[type=checkbox]{width:20px;height:20px;accent-color:#00ad7b}.foot{position:sticky;bottom:0;background:white;display:flex;gap:10px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid #eee}.foot button{flex:1}.muted{color:#9198a1;font-size:12px}.empty{text-align:center;color:#999;padding:30px}.hidden,[hidden]{display:none!important}dialog{border:0;border-radius:12px;width:calc(100% - 24px);max-width:520px;max-height:85dvh;padding:20px}dialog::backdrop{background:#0006}.result{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.error{color:#cb493a}.attachment{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #eee;padding:10px 0;overflow-wrap:anywhere}.line{border:1px solid #edf0f2;border-radius:6px;padding:12px;margin:12px 0}.step{color:#7e8790;font-size:12px;line-height:1.8}.qty{display:flex;gap:24px;margin-top:12px;color:#009f73}.qty small{display:block;color:#999;margin-bottom:5px}.bottomnote{text-align:center;padding:16px;color:#aaa;font-size:12px}main{max-width:760px;margin:auto}header>div{display:flex}button:disabled{opacity:.45}
/* 与智能制造管理零星工单清单保持一致的列表视觉 */
body{background:#f7f8fa;color:#242424;font-family:Roboto,"Helvetica Neue",Arial,"PingFang SC",sans-serif;font-size:14px}
main{max-width:none;margin:0}header{height:40px;min-height:40px;padding:0 12px;border:0;gap:8px;background:#fff}header strong{font-size:20px;font-weight:500;line-height:20px;flex:1;text-align:left}header .icon{padding:0;min-height:32px;min-width:20px;display:inline-flex;align-items:center;justify-content:center;color:#242424}header>div{gap:16px}header>div button{color:#3880ff!important;background:transparent}header a{color:#242424}.search{height:60px;padding:10px 12px 18px;position:relative;gap:0;align-items:center}.search:before{content:"";position:absolute;left:22px;top:23px;width:10px;height:10px;border:1.5px solid #808387;border-radius:50%;pointer-events:none}.search:after{content:"";position:absolute;left:32px;top:33px;width:5px;height:1.5px;background:#808387;transform:rotate(45deg);pointer-events:none}.search input{height:32px;border-radius:4px;padding:6px 38px;background:#f7f8fa;font-size:14px;color:#242424}.search input::placeholder{color:#b8bbbe}.search>button{display:none}.chips{padding:10px 12px;gap:8px;background:#f7f8fa;min-height:44px}.chips button{border-radius:12px;background:#fff;color:#242424;font-size:14px;min-height:24px;height:24px;line-height:24px;padding:0 16px;flex:0 0 200px}.chips button.active{color:#3880ff;background:#fff}.card{margin:0 12px 10px;border-radius:0;padding:12px;background:white;box-shadow:none}.card .number,.card .top>b{font-size:14px;color:#0054c9;font-weight:400}.card .number:before,.card .top>b:before{content:"▣";font-size:12px;margin-right:8px;color:#3880ff}.badge{border:1px solid #d6cae3;color:#8a38f5;background:transparent;border-radius:4px;padding:3px 10px;font-size:12px;font-weight:400}.kv{grid-template-columns:30% minmax(0,1fr);gap:6px;margin-top:8px;line-height:20px}.kv span:nth-child(odd){color:#808080}.section{margin:10px 12px;border-radius:0;padding:12px}.primary{background:#3880ff;color:white}.outline{border-color:#3880ff;color:#3880ff}a{color:#0054c9}.actions{border-top:0;margin-top:8px;padding-top:4px}button{border-radius:4px}.line{border-radius:0}.qty{color:#0054c9}.foot{border-color:#eee}.filter-panel{margin:0 12px 10px}.filter-panel{display:none!important}.bottomnote{padding:10px}.field input,.field select{border-radius:4px}.step{background:#fff}
@media(max-width:600px){.chips button{flex:1 0 auto;min-width:76px;padding:0 12px}.kv{grid-template-columns:110px minmax(0,1fr)}}

/* inspection-sheet1 表单规范：白底、分组标题、底部蓝色确认按钮 */
section#editor{background:#f7f8fa}#editor .section{background:#fff;border-radius:0;margin:0 0 10px;padding:0 12px}#editor .section h3{background:#f7f8fa;margin:0 -12px;padding:10px 0;font-size:15px;font-weight:500}#editor .field{min-height:48px;padding:10px 0;border-bottom:1px solid #eee}#editor .field input,#editor .field select{border:0;background:transparent;padding:0;text-align:right;color:#242424}#editor .foot{background:#fff;border:0;padding:12px 8px}#editor .foot .primary{border-radius:18px;background:#0867ed}.chips{display:flex!important}
.card{border-radius:6px;margin:10px 12px}.card .kv{grid-template-columns:92px minmax(0,1fr)}.card .actions{border-top:1px solid #eee;margin-top:12px}.card .actions a{font-size:13px}.outline{border:1px solid #1677ff;color:#1677ff;padding:10px;border-radius:5px}</style></head><body><main><header><a class="icon" href="移动端装车单.html" aria-label="返回">‹</a><strong id="title">发货计划查询</strong><div></div></header><div class="search"><input id="q" oninput="render()" placeholder="计划号/订单号/合同号/客户/状态" aria-label="搜索"><button class="primary" onclick="render()">查询</button></div><div class="chips" id="tabs"></div><div class="section filter-panel"><div id="filter" hidden><label class="field">客户<select id="customer"><option value="">全部客户</option><option>客户甲</option><option>客户乙</option></select></label><label class="field">组织<select id="org"><option>扬州曙光</option></select></label><label class="field">创建日期<input id="date" type="date"></label><label class="field">批次<input id="batch" placeholder="请输入批次"></label><div class="actions"><button onclick="reset()">重置</button><button class="primary" onclick="render()">查询</button></div></div></div><div id="list"></div><div class="bottomnote" id="count"></div></main><script>const HEADS=["销售单号", "物料编码", "物料说明", "客户物料说明", "计划批次", "客户批次", "计划数量", "未装车数量", "本地占用", "可装车数量", "销售单位", "仓库", "货位", "到货地址", "工装盘代码", "工装盘说明", "工程渠道", "特殊要求", "单位（辅）", "未装车数量（辅）", "销售单价", "物料毛重", "邮编", "国家", "省", "市", "区", "收货人"];const LINES=[["SO2610001 / 1.1", "630201030010030", "60227IEC01(BV)-450/750V-1×6", "BV-450/750V", "BKD261001-001", "KH2610-1", "0.300", "0.200", "0.000", "0.200", "km", "成品库", "A01", "项目现场", "DP-1", "木盘", "工程项目", "整盘发货", "m", "200", "6800.00", "120.00", "225000", "中国", "江苏省", "扬州市", "邗江区", "王师傅"], ["SO2610001 / 1.2", "630201030010031", "60227IEC01(BV)-450/750V-1×16", "BV-450/750V", "BKD261001-002", "KH2610-2", "0.300", "0.300", "0.000", "0.300", "km", "成品库", "A02", "项目现场", "DP-2", "木盘", "工程项目", "整盘发货", "m", "300", "6800.00", "120.00", "225000", "中国", "江苏省", "扬州市", "邗江区", "王师傅"], ["SO2610002 / 2.1", "630401010010043", "YJV-0.6/1kV-3×10", "BV-450/750V", "BKD261002-001", "KH2610-3", "2.000", "2.000", "0.000", "2.000", "km", "成品库", "A03", "项目现场", "DP-3", "木盘", "工程项目", "整盘发货", "m", "2000", "6800.00", "120.00", "225000", "中国", "江苏省", "扬州市", "邗江区", "王师傅"]];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fields(r,actual=false){return '<div class="kv">'+HEADS.map((h,i)=>'<span>'+esc(h)+'</span><span>'+esc(r[i])+'</span>'+(actual&&i===6?'<span>实出数量</span><span>—</span>':'')).join('')+'</div>'}let status='全部';const plans=[{no:'1065FJ26100001',customer:'客户甲',contract:'HT2610001',status:'部分发货',date:'2026-10-13',lines:LINES},{no:'1065FJ26100002',customer:'客户乙',contract:'HT2610002',status:'未发货',date:'2026-10-12',lines:[]}];function render(){const q=$('q').value.trim();const visible=plans.flatMap(p=>p.lines.map((r,i)=>({p,r,i}))).filter(x=>{const text=[x.p.no,x.p.customer,x.p.contract,...x.r].join(' ');return (!q||text.includes(q))&&(status==='全部'||x.p.status===status)});$('tabs').innerHTML=['全部','未发货','部分发货','全部发货'].map(v=>'<button class="'+(v===status?'active':'')+'" onclick="status=\''+v+'\';render()">'+v+'</button>').join('');$('list').innerHTML=visible.map(x=>'<article class="card"><div class="top"><span class="number">'+x.p.no+'</span><span class="badge">'+x.p.status+'</span></div><div class="kv"><span>销售单号</span><span>'+x.r[0]+'</span><span>物料编码</span><span>'+x.r[1]+'</span><span>物料说明</span><span>'+x.r[2]+'</span><span>计划批次</span><span>'+x.r[4]+'</span><span>客户批次</span><span>'+x.r[5]+'</span><span>计划数量</span><span>'+x.r[6]+'</span><span>未装车数量</span><span>'+x.r[7]+'</span><span>可装车数量</span><span>'+x.r[9]+' '+x.r[10]+'</span><span>仓库/货位</span><span>'+x.r[11]+' / '+x.r[12]+'</span><span>到货地址</span><span>'+x.r[13]+'</span></div><div class="actions"><a class="outline" href="javascript:void(0)" onclick="alert(\'查看发货计划明细\')">查看详情</a><a class="primary" style="padding:10px;border-radius:5px" href="移动端装车单.html?plan='+x.p.no+'">创建装车单</a></div></article>').join('')||'<div class="empty">暂无匹配的发货计划</div>';$('count').textContent='共 '+visible.length+' 条';}function reset(){['q','customer','date','batch'].forEach(id=>$(id).value='');status='全部';render()}render();const API_CONFIG={plans:''};async function refreshPlans(){if(!API_CONFIG.plans)return;try{const r=await fetch(API_CONFIG.plans);if(!r.ok)throw Error();const d=await r.json();if(!Array.isArray(d.plans))return;plans.splice(0,plans.length,...d.plans);render()}catch(e){}}setInterval(refreshPlans,300000);refreshPlans();</script></body></html>
