).flatMap(o=>lines.map(l=>({o,l}))).filter(({l})=>(!dealer||String(l.dealerName||'').includes(dealer))&&(!item||String(l.item||'').includes(item)));const total=Math.max(1,Math.ceil(rows.length/50));orderPage=Math.min(orderPage,total);const shown=rows.slice((orderPage-1)*50,orderPage*50);$('orderList').innerHTML=`<div class="scroll"><table><thead><tr><th>退货订单号</th><th>经销商编码</th><th>经销商名称</th><th>物料编码</th><th>物料名称</th><th>主单位</th><th>退货数量</th><th>辅助单位</th><th>辅助数量</th><th>原销售订单</th><th>退货接收日期</th><th>ERP接收数量</th><th>退货接收单位</th><th>操作</th></tr></thead><tbody>${shown.map(({o,l})=>`<tr><td>${o.id}</td><td>${val(l.dealerNum)}</td><td>${val(l.dealerName)}</td><td>${l.item}</td><td>${l.desc}</td><td>${l.unit}</td><td>${l.qty}</td><td>${val(l.secondaryUom)}</td><td>${val(l.secondaryQty)}</td><td>${val(l.sourceOrder)}</td><td>${val(l.receiptDate)}</td><td>${val(l.receiptQty)}</td><td>${val(l.receiptUom)}</td><td><button class="link" onclick="orderDetail('${o.id}')">详情</button></td></tr>`).join('')}</tbody></table></div><div class="pager">第${orderPage}/${total}页，共${rows.length}条　<button onclick="goOrderPage(-1)">‹</button> ${orderPage} <button onclick="goOrderPage(1)">›</button>　50条/页</div>`}function orderDetail(id){const o=orders.find(x=>x.id===id);$('orderInfo').innerHTML=info(o);$('readonlyLines').innerHTML=sourceTable(lines);view('orderDetail')}
function state(s){return s.lines.some(l=>l.inspection!=='已处理')?'待检验':'已处理'}function qc(s){return s.lines.some(l=>l.qc==='是')?'是':'否'}function toggleFilters(id,button){const hidden=$(id).classList.toggle('hidden');button.textContent=hidden?'更多⌄':'收起⌃';button.setAttribute('aria-expanded',String(!hidden))}function resetSales(){['salesSearch','salesOrderNo','salesCustomer','salesCustomerCode','salesDate'].forEach(x=>$(x).value='');['audit','inspection','qcFilter'].forEach(x=>$(x).value='全部');renderSales()}function renderSales(){const rows=sales.flatMap(s=>s.lines.map(l=>({s,l}))).filter(({s,l})=>s.id.includes($('salesSearch').value.trim())&&(!($('salesCustomer')?.value)||String(s.header?.customer||'').includes($('salesCustomer').value.trim()))&&s.order.id.includes($('salesOrderNo').value.trim())&&(!$('salesDate').value||(s.header?.date||s.order.date)===$('salesDate').value)&&($('audit').value==='全部'||s.audit===$('audit').value)&&($('inspection').value==='全部'||l.inspection===$('inspection').value)&&($('qcFilter').value==='全部'||l.qc===$('qcFilter').value));const total=Math.max(1,Math.ceil(rows.length/50));salesPage=Math.min(salesPage,total);$('salesList').innerHTML=`<div class="scroll"><table><thead><tr><th>选择单据</th><th>销售退货单</th><th>审核状态</th><th>质检状态</th><th>是否质检</th><th>单据类型</th><th>单据日期</th><th>退货客户</th><th>库管员</th><th>物料编码</th><th>物料名称</th><th>规格</th><th>退货数量</th><th>单位</th><th>退货订单号</th><th>退货仓库</th><th>库位</th><th>收货批次</th><th>操作</th></tr></thead><tbody>${rows.slice((salesPage-1)*50,salesPage*50).map(({s,l})=>`<tr><td>${box(s)}</td><td>${s.id}</td><td>${s.audit}</td><td>${l.inspection}</td><td>${l.qc}</td><td>${s.header?.type||'标准销售退货'}</td><td>${s.header?.date||s.order.date}</td><td>${esc(s.header?.customer||'—')}</td><td>${esc(s.header?.keeper||'张库管')}</td><td>${l.item}</td><td>${l.desc}</td><td>${esc(l.spec||'—')}</td><td>${l.qty}</td><td>${l.unit}</td><td>${s.order.id}</td><td>${esc(l.warehouse)}</td><td>${esc(l.location)}</td><td>${esc(l.receiveLot)}</td><td><button class="link" onclick="editSale('${s.id}')">详情</button></td></tr>`).join('')}</tbody></table></div><div class="pager">第${salesPage}/${total}页，共${rows.length}条　<button onclick="goSalesPage(-1)">‹</button> ${salesPage} <button onclick="goSalesPage(1)">›</button>　50条/页</div>`}function box(s){return `<input type="checkbox" ${selected.has(s.id)?'checked':''} onchange="this.checked?selected.add('${s.id}'):selected.delete('${s.id}')">`}function newSale(){draft={id:'TH2610000'+(sales.length+1),order:null,audit:'待提交',lines:[]};renderDraft();view('saleDetail')}function editSale(id){draft=JSON.parse(JSON.stringify(sales.find(s=>s.id===id)));renderDraft();view('saleDetail')}function saleHeader(){draft.header=draft.header||{type:'标准销售退货',date:'2026-10-14',keeper:'张库管',customer:'',remark:'',organization:'',trxType:'',trxDate:'',department:'',alias:'',project:''};const locked=draft.audit==='已提交';const fields=[['销售退货单','id'],['单据类型','type'],['单据日期','date'],['库管员','keeper'],['退货客户','customer'],['备注','remark']];return fields.map(([label,key])=>`<label>${label}<input type="${key==='date'?'date':key==='trxDate'?'datetime-local':'text'}" ${locked||key==='id'||key==='keeper'?'readonly':''} value="${esc(key==='id'?draft.id:draft.header[key])}" placeholder="${key==='customer'?'请选择退货客户':key==='organization'||key==='trxType'?'待ERP配置确认':''}" onchange="draft.header['${key}']=this.value"></label>`).join('')}function renderDraft(){const locked=draft.audit==='已提交';$('detailTitle').textContent='销售退货单详情 · '+draft.id;$('saleInfo').innerHTML=saleHeader();$('chooseBtn').disabled=locked;$('saveBtn').disabled=locked;$('editLines').innerHTML=`<table><thead><tr><th>退货订单明细</th><th>物料编码</th><th>物料说明</th><th>主单位</th><th>订单退货数量</th><th>本次退货数量 *</th><th>辅助单位</th><th>辅助数量</th><th>来源销售订单</th><th>原销售明细</th><th>退货接收日期</th><th>退货接收数量</th><th>退货接收单位</th><th>退货仓库 *</th><th>退库库位 *</th><th>收货批次号 *</th><th>序列号</th><th>生产号</th><th>是否质检</th><th>检验状态</th><th>批注信息</th><th>操作</th></tr></thead><tbody>${draft.lines.map((l,i)=>`<tr><td>${l.num}</td><td>${l.item}</td><td>${l.desc}</td><td>${l.primaryUom}</td><td>${l.qty}</td><td><input type="number" min="0" max="${l.qty}" value="${l.returnQty??l.qty}" ${locked?'readonly':''} onchange="update(${i},'returnQty',Number(this.value))" style="width:110px"></td><td>${l.secondaryUom}</td><td>${l.secondaryQty}</td><td>${l.sourceOrder}</td><td>${l.sourceLine}</td><td>${l.receiptDate}</td><td>${l.receiptQty}</td><td>${l.receiptUom}</td><td><select ${locked?'disabled':''} onchange="update(${i},'warehouse',this.value)"><option>成品退货库</option><option ${l.warehouse==='成品库'?'selected':''}>成品库</option></select></td>${['location','receiveLot','serial'].map(k=>`<td><input ${locked?'readonly':''} value="${esc(l[k]||'')}" style="width:140px" onchange="update(${i},'${k}',this.value)"></td>`).join('')}<td>${l.project}</td><td><select ${locked?'disabled':''} title="是：保存生成检验需求，待检验；否：保存即已处理" onchange="update(${i},'qc',this.value)"><option ${l.qc==='是'?'selected':''}>是</option><option ${l.qc==='否'?'selected':''}>否</option></select></td><td>${l.inspection||'未检验'}</td><td><input ${locked?'readonly':''} value="${esc(l.comment)}" onchange="update(${i},'comment',this.value)"></td><td><button ${locked?'disabled':''} class="link" onclick="draft.lines.splice(${i},1);renderDraft()">删除</button></td></tr>`).join('')}</tbody></table>${draft.lines.length?'':'<div class="hint">暂无明细，请先选单并勾选订单明细。</div>'}`}
function update(i,k,v){draft.lines[i][k]=v;if(k==='qc')draft.lines[i].inspection=v==='是'?'未检验':'已处理'}function openPicker(){$('pickOrder').innerHTML=orders.map(o=>`<option value="${o.id} / ${o.customer}">${o.id} / ${o.customer}</option>`).join('');if(draft.order)$('pickOrder').value=draft.order.id;pickRows();$('picker').showModal()}function pickRows(){const q=($('pickLineNo')?.value||'').trim();$('pickLines').innerHTML=sourceTable(lines.filter(x=>!q||x.num.includes(q)),true)}function addPicked(){const ids=[...document.querySelectorAll('.pickCheck:checked')].map(x=>x.value);if(!ids.length)return alert('请勾选至少一条明细');const o=orders.find(x=>x.id===$('pickOrder').value);if(draft.order&&draft.order.id!==o.id&&draft.lines.length&&!confirm('切换订单将清空现有明细，是否继续？'))return;if(draft.order?.id!==o.id)draft.lines=[];draft.order=o;ids.forEach(id=>{if(!draft.lines.some(x=>x.id===id))draft.lines.push({...lines.find(x=>x.id===id),warehouse:'成品退货库',location:'',receiveLot:'',serial:'',qc:'是',comment:'',inspection:'未检验'})});$('picker').close();renderDraft()}function saveSale(){if(draft.lines.some(l=>Number(l.returnQty??l.qty)<=0||Number(l.returnQty??l.qty)>Number(l.qty)))return alert('本次退货数量必须大于0，且不超过订单退货数量');if(!draft.order||!draft.lines.length)return alert('请选择订单及至少一条明细');if(draft.lines.some(l=>!l.warehouse||!l.location||!l.receiveLot))return alert('请完整填写退货仓库、退库库位和收货批次号');draft.lines.forEach(l=>{if(l.inspection==='未检验'||!l.inspection)l.inspection=l.qc==='是'?'待检验':'已处理'});const i=sales.findIndex(s=>s.id===draft.id);const saved=JSON.parse(JSON.stringify(draft));if(i>=0)sales[i]=saved;else sales.push(saved);msg('保存成功。审核状态：待提交；需质检明细：待检验；免检明细：已处理。');view('sales')}function submitSales(){const ss=sales.filter(s=>selected.has(s.id));if(!ss.length)return alert('请先勾选销售退货单');const invalid=ss.filter(s=>s.audit!=='待提交'||state(s)!=='已处理');if(invalid.length)return alert('仅待提交且检验已处理的单据可提交：'+invalid.map(s=>s.id).join('、'));msg('提交条件校验通过。当前为离线原型，未调用 ERP，保持待提交。实际系统仅在 ERP 最终成功回执后更新为已提交。')}renderOrders();renderSales();view('order');

function labelMobileTables(){document.querySelectorAll('table').forEach(table=>{const headers=Array.from(table.querySelectorAll(':scope > thead > tr > th')).map(th=>th.innerText.trim());if(!headers.length)return;table.classList.add('mobile-ready');table.querySelectorAll(':scope > tbody > tr').forEach(row=>{Array.from(row.children).forEach((cell,index)=>{const label=headers[index]||'明细';if(cell.dataset.label!==label)cell.dataset.label=label})})})}
labelMobileTables();new MutationObserver(labelMobileTables).observe(document.querySelector('main'),{childList:true,subtree:true});
