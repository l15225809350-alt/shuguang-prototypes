<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曙光MES · 成品退货</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:#34404d;background:#edf0f4}.topbar{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e4e8ed}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}.logo{background:#18a779;color:#fff;padding:6px 8px;border-radius:5px;font-size:16px}.user{color:#7c8997;font-size:13px}.layout{display:flex;height:calc(100vh - 56px)}aside{width:208px;background:#253343;flex-shrink:0;color:#bfc9d5;display:flex;flex-direction:column;transition:width .2s}.menu-title{padding:22px 20px 12px;font-size:12px;color:#8294a8;letter-spacing:1px}.group{border:0;width:100%;padding:16px 20px;background:#202d3c;color:#edf3fa;text-align:left;font:inherit;cursor:pointer;display:flex;justify-content:space-between}.items button{display:block;width:100%;border:0;background:transparent;color:#bfccda;text-align:left;padding:15px 20px 15px 44px;font:inherit;cursor:pointer;border-left:3px solid transparent}.items button:hover{background:#2b4051;color:#fff}.items button.active{background:#193f3e;border-left-color:#23bc8c;color:#60dfb6}.bottom{margin-top:auto;padding:18px 20px;font-size:12px;color:#8193a6}.workspace{flex:1;min-width:0;display:flex;flex-direction:column}.crumb{height:43px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#f7f9fb;color:#83909e;font-size:12px;border-bottom:1px solid #e2e7ed}.crumb strong{font-weight:400;color:#405363}.tabs{height:40px;display:flex;align-items:end;gap:6px;background:#e9eef3;padding:5px 14px 0}.tabs button{font:inherit;font-size:13px;background:#f5f7fa;color:#728090;border:1px solid #dfe5eb;border-bottom:0;border-radius:4px 4px 0 0;padding:10px 22px;cursor:pointer}.tabs button.active{background:#fff;color:#009e70;border-top:2px solid #14ac7f;padding-top:9px}.frames{flex:1;position:relative;min-height:0}iframe{border:0;width:100%;height:100%;display:block;background:#edf0f4}iframe[hidden]{display:none}.toggle{border:0;background:none;color:#617383;cursor:pointer;font-size:18px;margin-right:12px}.collapsed aside{width:0;overflow:hidden}.items[hidden]{display:none}@media(max-width:800px){aside{width:160px}.items button{padding-left:24px}.brand{font-size:15px}.user{display:none}}
</style></head><body><header class="topbar"><div class="brand"><span class="logo">MES</span>扬州曙光制造执行系统</div><div class="user">成品仓储　│　张库管</div></header><div class="layout" id="layout"><aside><div class="menu-title">业务导航</div><button class="group" onclick="toggleGroup()" aria-expanded="true" id="group">▦　成品退货 <span id="chevron">⌄</span></button><nav class="items" id="menu"><button class="active" data-page="order" onclick="switchPage('order')">退货订单查询</button><button data-page="register" onclick="switchPage('register')">退货登记</button></nav><div class="bottom">曙光 MES 系统 · 二期</div></aside><section class="workspace"><div class="crumb"><button class="toggle" onclick="document.getElementById('layout').classList.toggle('collapsed')" title="切换侧栏">☰</button>成品仓储 <span>／</span> 成品退货 <span>／</span><strong id="current">退货订单查询</strong></div><div class="tabs"><button class="active" data-page="order" onclick="switchPage('order')">退货订单查询</button><button data-page="register" onclick="switchPage('register')">退货登记</button></div><div class="frames"><iframe id="frame-order" title="退货订单查询" src="退货订单查询.html"></iframe><iframe id="frame-register" title="退货登记" src="销售退货单新版.html" hidden></iframe></div></section></div><script>
function switchPage(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('frame-order').hidden=page!=='order';document.getElementById('frame-register').hidden=page!=='register';document.getElementById('current').textContent=page==='order'?'退货订单查询':'退货登记';location.hash=page;}
function toggleGroup(){const menu=document.getElementById('menu');menu.hidden=!menu.hidden;document.getElementById('group').setAttribute('aria-expanded',String(!menu.hidden));document.getElementById('chevron').textContent=menu.hidden?'›':'⌄';}
if(location.hash==='#register')switchPage('register');window.addEventListener('hashchange',()=>switchPage(location.hash==='#register'?'register':'order'));
</script></body></html>
