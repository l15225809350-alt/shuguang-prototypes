<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发货计划查询</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,'PingFang SC',sans-serif;color:#333;background:#edf0f4}header{height:50px;background:#203649;color:#cbd5df;display:flex;align-items:center;gap:25px;padding:0 20px}header b{font-size:26px;color:white;margin-right:45px}aside{position:absolute;top:50px;bottom:0;width:200px;background:#162837;color:#b9c8d5}aside h3{padding:15px 23px;color:white;font-size:16px}aside button{width:100%;text-align:left;background:transparent;border:0;color:inherit;padding:17px 24px}aside button.active{background:#00ad77;color:white}main{margin-left:200px;padding:20px;min-height:calc(100vh - 50px)}.crumb{font-size:12px;color:#666;margin-bottom:12px}.title{display:flex;align-items:center;justify-content:space-between;background:white;padding:16px 20px;margin:-4px -4px 0}.title h2{font-size:20px;margin:0}button{font:inherit;border:1px solid #d8dce1;background:white;padding:8px 16px;color:#444;cursor:pointer;border-radius:2px}button.primary{background:#00ad77;border-color:#00ad77;color:white}.link{border:0;background:transparent;color:#009c70;padding:3px 7px}.filters{background:#f8f9fa;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}input,select{padding:8px;border:1px solid #d8dce1;background:white;color:#444;font:inherit;min-width:120px}input{max-width:100%}.tabs{display:flex;gap:5px;margin:14px 0;flex-wrap:wrap}.tabs button{background:transparent;border-color:transparent}.tabs .selected{background:white;border-color:#d8dce1}.sheet{background:white;border:1px solid #d8dce1;overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{background:#f8f9fb;text-align:left;font-weight:600}td,th{padding:14px 12px;border-bottom:1px solid #e1e4e8}tbody tr:nth-child(even){background:#fcfcfc}.green{color:#009f72}.muted{color:#8a939f}.status{color:#089c72}.error{color:#d75b44}.pager{text-align:right;padding:15px;background:white;color:#66717d}.detail{background:#f6faf9!important}.detail td{padding:18px}.subtable{background:white}.small{font-size:12px;color:#7c8791}.form{background:white;padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.form label{display:flex;flex-direction:column;gap:8px}.section{background:white;margin:15px 0;padding:18px}.section h3{font-size:15px;margin:0 0 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.notice{padding:10px 0;color:#7a828b}.toast{padding:10px;background:#e5f6ef;color:#008d61;margin:10px 0}.hidden{display:none!important}.steps{background:white;padding:18px;color:#749287;word-spacing:20px}.foot{padding:18px 0;color:#89929e;font-size:12px}dialog{border:1px solid #ddd;width:850px;max-width:95%;padding:25px}dialog::backdrop{background:#0006}@media(max-width:800px){aside{width:150px}main{margin-left:150px;padding:12px}header{gap:12px}header span{display:none}.form{grid-template-columns:1fr 1fr}}@media(max-width:520px){aside{position:static;width:auto;display:flex}aside h3{display:none}aside button{padding:12px}main{margin:0}.form{grid-template-columns:1fr}.title{align-items:flex-start;gap:10px;flex-direction:column}}
#plan > .sheet > table{table-layout:fixed}#plan > .sheet > table > thead th{white-space:normal}#plan > .sheet > table > thead th:first-child{width:42px}.detail .sheet{width:100%;max-width:100%;overflow-x:auto}.detail .subtable{width:max-content;min-width:100%}
main{margin:0;padding:20px;min-height:100vh;width:100%}.title{margin:0;padding:16px 20px}.filters{display:grid;grid-template-columns:minmax(350px,1fr) minmax(350px,1fr);gap:12px 40px;padding:18px 20px}.filters label{display:flex;align-items:center;gap:10px;white-space:nowrap}.filters label input,.filters label select{width:100%;min-width:0;height:34px}.filter-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}.filters #more{grid-column:1/-1}.subtable td,.subtable th{padding:12px 14px}.form input,.form select{width:100%;height:36px}.section{margin-top:16px}.steps{word-spacing:normal;color:#66717d;border-bottom:1px solid #edf0f4}.error{color:#cf493a}.response{white-space:pre-wrap;line-height:1.8}.title h2{font-weight:600}input[type=checkbox]{min-width:0;width:16px;height:16px}button:disabled{opacity:.55;cursor:default}@media(max-width:800px){main{margin:0;padding:12px}.filters{grid-template-columns:1fr;gap:12px}.form{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{margin:0}.form{grid-template-columns:1fr}}
/* MES control baseline: field 334×32, query/reset button 60×32. */
:root{--mes-field-width:334px;--mes-field-height:32px;--mes-query-width:60px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 40px}.filters label{display:grid;grid-template-columns:84px var(--mes-field-width);gap:10px;align-items:center;white-space:nowrap}.filters label input,.filters label select,.form label input,.form label select{box-sizing:border-box;width:var(--mes-field-width);min-width:0;max-width:100%;height:var(--mes-field-height);padding:5px 10px;flex:none}.filters #more{display:flex;flex-wrap:wrap;gap:10px 40px;flex-basis:100%;width:100%}.filter-actions{margin-left:auto;display:flex;gap:8px}.filter-actions button:not(.link),.filters > button.primary{width:var(--mes-query-width);height:32px;min-width:60px;padding:0;text-align:center}.form{grid-template-columns:repeat(auto-fit,minmax(334px,334px));gap:18px 40px}.form label{width:334px;max-width:100%;min-width:0}.expand-cell{width:42px}.expand-button{width:26px;height:26px;padding:0}

 #plan .sheet{overflow-x:auto}#plan .sheet table{min-width:1800px;table-layout:auto}#plan .sheet th,#plan .sheet td{white-space:nowrap}</style><style>

</style><style>#planInfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 32px;padding:20px;background:#f6f8fa;border:1px solid #e6ebf0;border-radius:4px}#planInfo .info-item{min-width:0}#planInfo .info-label{font-size:13px;color:#748293;margin-bottom:9px;line-height:20px}#planInfo .info-value{font-size:14px;color:#304254;line-height:22px;overflow-wrap:anywhere}@media(max-width:800px){#planInfo{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){#planInfo{grid-template-columns:1fr}}</style></head><body><main><section id="plan"><div class="title"><h2>发货计划列表</h2></div><div class="filters"><label>关键字： <input id="search" placeholder="计划号/订单号/合同号"></label><label>客户： <select><option>全部客户</option><option>客户甲</option></select></label><div class="filter-actions"><button class="link" onclick="document.getElementById('more').classList.toggle('hidden')">更多⌄</button><button onclick="document.getElementById('search').value='';filterPlan()">重置</button><button class="primary" onclick="filterPlan()">查询</button></div><div id="more" class="hidden"><label>创建日期：<input type="date"></label><label>批次：<input placeholder="请输入批次"></label></div></div><div class="sheet"><table><thead><tr><th>发货计划编号</th><th>销售订单号</th><th>合同号</th><th>客户名称</th><th>客户编码</th><th>是否有卸车费</th><th>现款现货</th><th>虚拟发货</th><th>状态</th><th>创建时间</th><th>经销商名称</th><th>经销商代码</th><th>承运商编码</th><th>承运商名称</th><th>操作</th></tr></thead><tbody id="plans"><tr data-status="部分发货"><td>1065FJ26100001</td><td>SO2610001</td><td>HT2610001</td><td>客户甲</td><td>KH001</td><td>否</td><td>否</td><td>否</td><td>部分发货</td><td>2026-10-13 10:00:00</td><td>经销商甲</td><td>JXS001</td><td>CY001</td><td>承运物流公司</td><td><button class="link" onclick="showPlanDetail(this)">查看详情</button></td></tr><tr data-status="未发货"><td>1065FJ26100002</td><td>SO2610002</td><td>HT2610002</td><td>客户乙</td><td>KH002</td><td>否</td><td>否</td><td>否</td><td>未发货</td><td>2026-10-13 10:00:00</td><td>经销商乙</td><td>JXS002</td><td>CY002</td><td>承运物流公司</td><td><button class="link" onclick="showPlanDetail(this)">查看详情</button></td></tr></tbody></table></div></td></tr></tbody></table><div class="pager">第1/1页，共2条　 ‹　 <span class="green">1</span>　 ›　 50条/页</div></div></section><section id="planDetail" class="hidden"><div class="title"><h2>发货计划详情</h2><button onclick="planDetail.classList.add('hidden');plan.classList.remove('hidden')">返回列表</button></div><div class="section"><h3>发货计划信息</h3><div id="planInfo" class="form"></div></div><div class="section"><h3>发货计划明细</h3><div class="sheet"><table><thead id="planDetailHead"></thead><tbody id="planDetailRows"></tbody></table></div></div></section></main><script>const $=id=>document.getElementById(id);function filterPlan(){const q=$('search').value.trim(),st='全部';document.querySelectorAll('#plans tr').forEach(r=>r.hidden=!!q&&!r.textContent.includes(q)||st!=='全部'&&!r.dataset.status.includes(st))}document.querySelectorAll('[data-tabs] button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');filterPlan()});function showPlanDetail(b){const r=b.closest('tr');$('plan').classList.add('hidden');$('planDetail').classList.remove('hidden');$('planInfo').innerHTML='<label>发货计划编号<input readonly value="'+r.cells[0].innerText+'"></label><label>销售单号<input readonly value="'+r.cells[1].innerText+'"></label><label>状态<input readonly value="'+r.cells[9].innerText+'"></label>';}
function showPlanDetail(button){const row=button.closest('tr'),number=row.cells[0].textContent;const all=[...document.querySelectorAll('#plans > tr')].filter(r=>r.cells[0].textContent===number);const isFirst=number==='1065FJ26100001';const header=[['发货计划编号',number],['客户',isFirst?'客户甲':'客户乙'],['合同号',isFirst?'HT2610001':'HT2610002'],['组织','扬州曙光'],['状态',row.dataset.status],['创建日期','2026-10-13']];const info=$('planInfo');info.replaceChildren();header.forEach(([title,value])=>{const label=document.createElement('label');label.append(document.createTextNode(title));const input=document.createElement('input');input.readOnly=true;input.value=value;label.append(input);info.append(label);});const head=$('planDetailHead'),body=$('planDetailRows');head.replaceChildren();body.replaceChildren();const tr=document.createElement('tr');['销售单号','物料编码','物料说明','计划批次','客户批次','计划数量','未装车数量','可装车数量','销售单位','仓库','货位','到货地址','工装盘代码','工装盘说明','工程渠道','特殊要求','单位（辅）','未装车数量（辅）','销售单价','物料毛重','邮编','国家','省','市','区','收货人'].forEach(text=>{const th=document.createElement('th');th.textContent=text;tr.append(th);});head.append(tr);all.forEach(r=>{const detail=document.createElement('tr');const suffix=r.cells[1].textContent.endsWith('1.1')?'1':r.cells[1].textContent.endsWith('1.2')?'2':'3';const values=[...Array.from(r.cells).slice(1,9).map(c=>c.textContent),'km','成品库','A0'+suffix,'项目现场','DP-'+suffix,'木盘','工程项目','整盘发货'];values.forEach(text=>{const td=document.createElement('td');td.textContent=text;detail.append(td);});body.append(detail);});$('plan').classList.add('hidden');$('planDetail').classList.remove('hidden');window.scrollTo(0,0);}

const planHeaderLabels=["发货计划编号", "销售订单号", "合同号", "客户名称", "客户编码", "是否有卸车费", "现款现货", "虚拟发货", "状态", "创建时间", "经销商名称", "经销商代码", "承运商编码", "承运商名称", "操作"];
const planLineSnapshots=[["1065FJ26100001", "SO2610001 / 1.1", "630201030010030", "60227IEC01(BV)-450/750V-1×6", "BKD261001-001", "KH2610-1", "0.300", "0.200", "0.200", "部分发货"], ["1065FJ26100001", "SO2610001 / 1.2", "630201030010031", "60227IEC01(BV)-450/750V-1×16", "BKD261001-002", "KH2610-2", "0.300", "0.300", "0.300", "部分发货"], ["1065FJ26100002", "SO2610002 / 2.1", "630401010010043", "YJV-0.6/1kV-3×10", "BKD261002-001", "KH2610-3", "2.000", "2.000", "2.000", "未发货"]];
function showPlanDetail(button){const row=button.closest('tr'),number=row.cells[0].textContent;const info=$('planInfo');info.replaceChildren();planHeaderLabels.slice(0,-1).forEach((title,i)=>{const item=document.createElement('div');item.className='info-item';const name=document.createElement('div');name.className='info-label';name.textContent=title;const value=document.createElement('div');value.className='info-value';value.textContent=row.cells[i].textContent||'—';item.append(name,value);info.append(item);});const head=$('planDetailHead'),body=$('planDetailRows');head.replaceChildren();body.replaceChildren();const tr=document.createElement('tr');['销售单号','物料编码','物料说明','计划批次','客户批次','计划数量','未装车数量','可装车数量','销售单位','仓库','货位','到货地址','工装盘代码','工装盘说明','工程渠道','特殊要求','单位（辅）','未装车数量（辅）','销售单价','物料毛重','邮编','国家','省','市','区','收货人'].forEach(text=>{const th=document.createElement('th');th.textContent=text;tr.append(th);});head.append(tr);planLineSnapshots.filter(r=>r[0]===number).forEach((r,i)=>{const detail=document.createElement('tr');[...r.slice(1,9),'km','成品库','A0'+(i+1),'项目现场','DP-'+(i+1),'木盘','工程项目','整盘发货','m',String(Number(r[7])*1000),'6800.00','120.00','225000','中国','江苏省','扬州市','邗江区','王师傅'].forEach(text=>{const td=document.createElement('td');td.textContent=text;detail.append(td);});body.append(detail);});$('plan').classList.add('hidden');$('planDetail').classList.remove('hidden');window.scrollTo(0,0);}
</script></body></html>
