<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MES 成品发货</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px Arial,'PingFang SC',sans-serif;color:#333;background:#edf0f4}.app{height:100%;display:flex;flex-direction:column}.top{height:52px;display:flex;align-items:center;background:#203649;color:#fff;padding:0 22px;gap:28px}.brand{font-size:19px;font-weight:600;letter-spacing:1px}.top .module{color:#cbd5df}.body{display:flex;flex:1;min-height:0}.side{width:210px;background:#162837;color:#b9c8d5;padding-top:12px}.side h3{font-size:15px;color:#fff;padding:14px 22px;margin:0}.side button{display:block;width:100%;padding:14px 22px;border:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer;border-left:3px solid transparent}.side button:hover{background:#1d394b}.side button.active{background:#00ad77;color:#fff;border-left-color:#83e0bf}.content{flex:1;min-width:0;background:#edf0f4}.content iframe{width:100%;height:100%;border:0;background:#edf0f4}@media(max-width:600px){.side{width:150px}.top{padding:0 14px}.brand{font-size:16px}.top .module{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand">MES 制造执行系统</div><div class="module">销售中心 / 成品发货</div></header><div class="body"><nav class="side"><h3>成品发货</h3><button class="active" data-page="发货计划查询.html">发货计划查询</button><button data-page="装车单.html">装车单管理</button></nav><main class="content"><iframe id="page" title="成品发货业务页面"></iframe></main></div></div><script>const frame=document.getElementById('page'),buttons=[...document.querySelectorAll('.side button')];function openPage(page){frame.src=page;buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page));}buttons.forEach(b=>b.onclick=()=>openPage(b.dataset.page));openPage('发货计划查询.html');</script></body></html>
