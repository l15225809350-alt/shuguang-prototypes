function openOtherMaterials(){bomPageSnapshot={html:$('#layer').innerHTML,values:[...document.querySelectorAll('#layer input')].map(e=>({value:e.value,checked:e.checked}))};otherPicks=new Set();modal('添加其他物料',`<div class="stock-search"><span>⌕</span><input placeholder="物料编码/名称/子库编码" oninput="document.querySelectorAll('.other-material-card').forEach(e=>e.hidden=!e.dataset.search.includes(this.value.trim()))"></div><div class="stock-list">${otherMaterials.map((x,i)=>`<label class="stock-card other-material-card" data-search="${x.code} ${x.name} ERP21"><input type="checkbox" onchange="this.checked?otherPicks.add(${i}):otherPicks.delete(${i});$('#otherCount').textContent=otherPicks.size+'项';$('#otherAdd').disabled=!otherPicks.size"><div class="stock-info"><div class="stock-name">${x.code} ${x.name}</div><div class="stock-meta"><p><strong>可用数量</strong><span>${x.qty} kg</span></p></div></div></label>`).join('')}</div>`,`<span class="stock-total">总计：<span id="otherCount">0项</span></span><button id="otherAdd" class="primary" disabled onclick="commitOtherMaterials()">添加</button>`);document.querySelector('.modal').classList.add('stock-dialog');document.querySelector('.mh button:first-child').onclick=restoreBomPage}

let semiAvailableLocations=['ERP21'];
function showSemiLocationNotice(){const overlay=document.createElement('div');overlay.className='semi-location-overlay';overlay.innerHTML='<section><h3>提示</h3><p>请联系管理员维护工作单元中半成品可用库存地</p><button class="primary">知道了</button></section>';overlay.querySelector('button').onclick=()=>overlay.remove();document.body.append(overlay)}
function reportSelect(){if(reportFeedTab===1&&!semiAvailableLocations.length){reportFeedTab=0;showSemiLocationNotice();return}let t=reportFeedTab,f=reportFilters[t],hasFilter=Object.values(f).some(Boolean);let rows=reportStocks[t].filter(x=>(t===0||hasFilter||x.recommended)&&Object.entries(f).every(([k,v])=>!v||String(x[k]||'').includes(v)));modal('选择投料物料',`<div class="feed-tabs">${['选择在制品','选择半成品'].map((x,i)=>`<button class="${t===i?'selected':''}" onclick="reportFeedTab=${i};reportSelect()">${x}</button>`).join('')}</div><div class="feed-select-tools"><input id="reportKeyword" placeholder="${t===0?'请输入关键字搜索':'物料编码/名称'}" oninput="document.querySelectorAll('.report-stock-row').forEach(e=>e.hidden=!e.dataset.search.toLowerCase().includes(this.value.trim().toLowerCase()))"></div><div class="other-stock-entry"><span>${t===0?'在制品库存':'半成品库存'}</span><button onclick="reportFilter()">筛选其他${t===0?'在制品':'半成品'} <span>›</span></button></div><div class="feed-source">如下是<span>${t===0?'MES可用在制品库存':(hasFilter?'ERP半成品筛选结果':'ERP可用半成品库存 · 默认BOM推荐')}</span>${Object.values(f).some(Boolean)?'<button onclick="reportFilters[reportFeedTab]={};reportSelect()">清除筛选</button>':''}</div><div class="report-stock-list">${rows.map(x=>`<label class="report-stock-row" data-search="${t===0?`${x.code} ${x.name} ${x.batch} ${x.plan||''}`:`${x.code} ${x.name}`}"><input type="checkbox" ${reportChosen.has(x.id)?'checked':''} onchange="this.checked?reportChosen.add('${x.id}'):reportChosen.delete('${x.id}');updateReportCount()"><div class="report-stock-info"><div class="row between"><strong>${x.name}</strong>${t===0||x.recommended?`<span class="bom-tag">${t===0?'推荐':'BOM推荐'}</span>`:''}</div><p><b>数量</b><span class="orange">${x.qty} kg</span></p><p><b>盘号</b><span>${x.reel||'--'}</span></p><p><b>批次号</b><span>${x.batch||'--'}</span></p><p><b>计划号</b><span>${x.plan||'--'}</span></p><p><b>销售订单明细</b><span>${x.order||'--'}</span></p><p><b>备注</b><span>${x.note||'--'}</span></p></div></label>`).join('')||'<div class="empty-wip">暂无匹配库存</div>'}</div>`,`<span class="stock-total">总计：<span id="reportSelectedCount">${reportChosen.size}项</span></span><button id="reportSelectAdd" class="primary" ${reportChosen.size?'':'disabled'} onclick="confirmReportMaterials()">添加</button>`);document.querySelector('.modal').classList.add('stock-dialog','report-select-dialog');document.querySelector('.mh button:first-child').onclick=reportFeedScan}
function updateReportCount(){$('#reportSelectedCount').textContent=reportChosen.size+'项';$('#reportSelectAdd').disabled=!reportChosen.size}
function reportFilter(){let t=reportFeedTab,f=reportFilters[t],fields=t===0?[['plan','生产计划','请选择生产计划　＋'],['order','订单明细','请选择销售订单明细　›'],['code','库存物料','请选择库存物料　＋'],['reel','盘具号','请输入或选择盘具号　›'],['process','工序','请选择工序　＋']]:[['code','库存物料','请输入物料编码或选择库存物料'],['plan','生产计划','请输入或选择生产计划']];modal(t===0?'筛选在制品':'筛选半成品',`<div class="report-filter-fields">${fields.map(([k,n,ph])=>`<div class="filter-line"><span>${n}</span><input data-filter="${k}" placeholder="${ph}" value="${f[k]||''}"></div>`).join('')}</div>`,btn('重置',"reportFilters[reportFeedTab]={};reportFilter()")+btn('查询','applyReportFilter()','primary'));document.querySelector('.modal').classList.add('stock-dialog','report-filter-dialog');document.querySelector('.mh button:first-child').onclick=reportSelect}
function applyReportFilter(){let f={};document.querySelectorAll('[data-filter]').forEach(e=>f[e.dataset.filter]=e.value.trim());reportFilters[reportFeedTab]=f;reportSelect()}
function confirmReportMaterials(){let rows=reportStocks.flat().filter(x=>reportChosen.has(x.id));modal('确认投料数量',`<div class="selected-stock">${rows.map(x=>`<div class="stock-confirm"><h3>${x.name}</h3><span class="tag">${x.type}</span><p class="muted">可用数量 ${x.qty} kg</p><label>使用数量（kg）*</label><input data-report-item="${x.id}" type="number" min="0.001" max="${x.qty}" value="${Math.min(1,x.qty)}"><label><input type="checkbox" onchange="this.parentElement.nextElementSibling.hidden=!this.checked"> 指定替代料</label><select hidden><option value="">请选择被替代的BOM需求物料</option><option>硬铜单丝(TY) 2.18单丝</option></select></div>`).join('')}</div>`,btn('返回选择','reportSelect()')+btn('确认添加','commitReportMaterials()','primary'));document.querySelector('.modal').classList.add('stock-dialog','stock-confirm-dialog');document.querySelector('.mh button:first-child').onclick=reportSelect}
function commitReportMaterials(){let items=[];for(let e of document.querySelectorAll('[data-report-item]')){let x=reportStocks.flat().find(x=>x.id===e.dataset.reportItem),q=Number(e.value),sub=e.closest('.stock-confirm').querySelector('select');if(q<=0||q>x.qty)return toast('使用数量须大于0且不超过可用库存');if(!sub.hidden&&!sub.value)return toast('请选择被替代的BOM需求物料');items.push({...x,use:q,sub:sub.hidden?'--':sub.value})}restoreReport();$('#reportWip').querySelector('.empty-wip')?.remove();items.forEach(x=>$('#reportWip').insertAdjacentHTML('beforeend',`<div class="wip-card" data-material-type="${x.type}"><div class="row between"><strong>${x.name}</strong><span class="tag">${x.type}</span></div><p>替代物料　<span class="muted">${x.sub}</span></p><p>盘具号　　<span class="muted">${x.reel||'--'}</span></p><p>批次号　　<span class="muted">${x.batch}</span></p><p>备注　　　<span class="muted">--</span></p><div class="row between"><span class="report-use-line"><b>使用数量</b><button class="report-use-edit" onclick="editReportUse(this)"><input class="wip-qty" type="number" value="${x.use}" readonly><span>kg　›</span></button></span><button class="record-icon" aria-label="移除投料" onclick="this.closest('.wip-card').remove()">×</button></div></div>`));toast('已添加至本次报工投料明细')}
function addReportWip(){let el=$('#reportWip');if(!el.querySelector('.wip-card')){el.innerHTML='<div class="wip-card"><strong>硬铜单丝(TY) 2.18单丝</strong><p>批次号 PC20230105000-02-2</p><p>使用数量 <input class="wip-qty" type="number" value="1"> m</p></div>';toast('已扫码添加在制品，请确认数量')}else toast('已识别在制品，请确认卡片中的使用数量')}
function reportSend(){let q=prompt('请输入送检样品数量（大于0）','1');if(q===null)return;if(Number(q)<=0)return toast('样品数量必须大于0');$('#reportInspection').textContent='待提交送检 · 样品数量 '+Number(q)+' m';toast('送检信息已填写，将随报工提交')}
function startReportProgress(save){cacheReport();const total=Math.max(1,document.querySelectorAll('#reportWip .wip-card').length),simulation=$('#sim').value;let done=0,ok=0,fail=0;modal('正在提交报工',`<div class="report-progress"><div class="progress-stage" id="progressStage">正在处理投料</div><div class="progress-numbers"><strong id="progressCount">0 / ${total}</strong><span id="progressPercent">0%</span></div><div class="progress-track"><div id="progressFill"></div></div><div class="progress-counts"><span>成功 <b id="progressOk">0</b> 条</span><span>失败 <b id="progressFail">0</b> 条</span></div><p id="progressHint">投料进度表示处理完成情况</p></div>`, '<button disabled>处理中，请稍候</button>');document.querySelector('.modal').classList.add('report-progress-dialog');document.querySelectorAll('.report-progress-dialog .mh button').forEach(b=>b.disabled=true);function advance(){if(simulation==='unknown'&&done===total-1){$('#progressStage').textContent='投料结果待确认';$('#progressHint').textContent='接口超时，正在查询原请求结果';$('#progressHint').classList.add('orange');document.querySelector('.report-progress-dialog .mf').innerHTML=btn('查询处理结果',"toast('已发起原请求结果查询，请稍候')");return}done++;if(simulation==='fail'&&done===total)fail++;else ok++;$('#progressCount').textContent=done+' / '+total;$('#progressPercent').textContent=Math.round(done/total*100)+'%';$('#progressFill').style.width=done/total*100+'%';$('#progressOk').textContent=ok;$('#progressFail').textContent=fail;if(done<total){setTimeout(advance,650);return}$('#progressStage').textContent='投料处理完成，正在提交报工';$('#progressHint').textContent='投料处理100%，不代表全部投料成功';setTimeout(()=>{save();logs.unshift('报工成功；投料成功'+ok+'条，失败'+fail+'条');render();if(fail){showFeedSyncResults();toast('报工成功，部分投料同步失败')}else{dismiss();toast('报工成功，'+ok+'条投料处理成功')}},1100)}setTimeout(advance,700)}
function saveReport(){let qty=[...document.querySelectorAll('.rq')].reduce((a,b)=>a+Number(b.value),0),reel=$('#reel').value,wh=$('#wh').value,stock=$('#stock').value,type=$('#outtype').value,note=$('#rnote').value;if(!reel||qty<=0)return toast('请填写盘具号及大于0的报工数量');if(!document.querySelector('.time'))return toast('请至少保留一条工时');if(type==='成品'&&(!$('#weight').value||!$('#plate').value||!$('#qbatch').value))return toast('请填写成品称重、物料盘号及质检批号');let x=reports.find(x=>x.id===editId);if(x&&x.quality!=='未送检')return toast('存在送检关联，请先按业务规则解除关联');const save=()=>{let r={id:x?x.id:Date.now(),no:x?x.no:'PC20261022-'+(reports.length+1),qty,reel,note,stock,quality:'未送检',status:wh==='否'?'无需入库':type==='成品'?'待送检入库':'入库成功'};if(x)Object.assign(x,r);else reports.push(r);active=2};startReportProgress(save)}
function reportDetail(id){let x=reports.find(x=>x.id===id);modal('报工详情',`<div class="card"><h3>${x.no}</h3><p>数量：${x.qty} kg　盘具：${x.reel}</p><p>库存地：${x.stock}　入库状态：${x.status}</p><p>质量状态：${x.quality}</p><p>撤销状态：${x.deleted?'已撤销':'有效'}</p></div>`)}
function printRecord(id){modal('打印预览',`<div class="card"><h3>生产报工标签</h3><p>${reports.find(x=>x.id===id).no}</p><p>硬铜单丝(TY) 2.18单丝</p><p>盘具号 33</p></div>`,btn('模拟打印',"toast('已发送打印任务（演示）');dismiss()",'primary'))}
function editReportFeeds(id){modal('修改关联投料',`<div class="card"><p>报工关联投料（演示）</p>${feeds.filter(x=>!x.cancelled).map(x=>`<div class="row between"><p>${x.name}　${x.qty} kg</p><div>${btn('修改',`editFeed(${x.id})`)} ${btn('取消投料',`cancelFeed(${x.id})`,'danger')}</div></div>`).join('')||'暂无有效投料'}</div>`,btn('新增投料','feed()'))}
function deleteReport(id){let x=reports.find(x=>x.id===id);if(x.quality!=='未送检')return modal('不可删除','<div class="card"><p>该记录存在送检或检测关联，请先按业务规则解除关联。</p></div>');modal('删除报工确认',`<div class="card"><h3>${x.no}</h3><p>报工数量 ${x.qty} kg</p><p>${x.status==='无需入库'?'撤销报工并更新工单完成数量。':x.stock.startsWith('MES')?'MES撤销报工及入库，扣减原产出库存。':'先调用ERP取消入库，成功后撤销MES报工及入库关联。'}</p><p>操作保留历史记录与撤销留痕。</p></div>`,btn('返回','dismiss()')+btn('确认删除',`run('删除报工',()=>{reports.find(x=>x.id===${id}).deleted=true},${x.status==='无需入库'||x.stock.startsWith('MES')})`,'danger'))}
function inspect(){modal('完工送检',`<div class="card"><h3>选择报工记录（可多选）</h3>${reports.filter(x=>!x.deleted).map(x=>`<label><input class="pick" type="checkbox" value="${x.id}" ${x.quality!=='未送检'?'disabled':''}> ${x.no}　${x.qty} kg　${x.quality}</label>`).join('')}<label>样品数量（kg）*</label><input id="sample" type="number" min="0.001"></div>`,btn('取消','dismiss()')+btn('提交送检','submitInspect()','primary'))}
function submitInspect(){let ids=[...document.querySelectorAll('.pick:checked')].map(e=>Number(e.value)),q=Number($('#sample').value);if(!ids.length||q<=0)return toast('请选择报工记录并填写样品数量');if(q>reports.filter(x=>ids.includes(x.id)).reduce((a,b)=>a+b.qty,0))return toast('样品数量不能超过选中报工总量');reports.filter(x=>ids.includes(x.id)).forEach(x=>x.quality='已送检');quality.push({id:Date.now(),no:'SZD20261022-'+quality.length,qty:q,status:'待检验'});logs.unshift('提交送检成功');dismiss();active=3;render();toast('送检申请提交成功')}
function qualityDetail(id){let x=quality.find(x=>x.id===id);modal('完工送检详情',`<div class="card"><h3>${x.no}</h3><p>样品数量：${x.qty} kg　状态：${x.status}</p><p>移动端查看送检及检验结果，正式检验由PC端质量检测模块完成。</p></div>`,btn('关闭','dismiss()'))}
function more(){modal('更多操作',`<div class="card">${btn('查看操作留痕','audit()')} ${btn('查看工艺','process()')} ${btn('完工送检','inspect()')}</div>`)}function audit(){modal('操作留痕',`<div class="card">${logs.map(x=>`<p class="log">${x}</p>`).join('')||'暂无本次演示操作'}</div>`)}render();
</script></html>
